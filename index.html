<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETA — Edge Thin Agent</title>
<!-- 第三方库 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-theme">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hljs-theme-light" disabled>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<!-- DOMPurify: Markdown 渲染前净化，防止抓取内容被复述后注入脚本 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<!-- 样式 -->
<link rel="stylesheet" href="css/styles.css">
<!-- PWA：manifest 与图标都用相对路径，兼容 GitHub Pages 项目页子路径部署 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6366f1">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
</head>
<body>

<!-- TOAST -->
<div class="toast-container" id="toasts"></div>

<!-- 移动端抽屉遮罩（窄屏下点击关闭侧栏/缓存区） -->
<div class="drawer-scrim" id="drawerScrim" onclick="closeDrawers()"></div>

<!-- IMAGE VIEWER -->
<div class="img-viewer" id="imgViewer" style="display:none" onclick="this.style.display='none'">
  <img id="imgViewerSrc">
</div>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h2>✦ ETA</h2>
    <button class="icon-btn" onclick="newConversation()" title="新对话">＋</button>
  </div>
  <div class="sidebar-section">
    <div class="sidebar-section-title">对话列表</div>
  </div>
  <!-- 全局对话搜索：跨所有会话检索消息正文 -->
  <div class="gs-wrap">
    <input id="gsInput" class="gs-input" placeholder="🔍 搜索所有对话..."
      oninput="gsInputChanged()" onkeydown="gsKey(event)">
  </div>
  <div class="gs-results" id="gsResults"></div>
  <div class="conv-list" id="convList"></div>
  <div class="config-panel" id="configPanel">
    <details class="cfg-group" id="grpApi" open ontoggle="cfgGroupToggled(event)">
      <summary class="cfg-group-head">
        <span class="cfg-group-title" id="grpApiTitle">API 连接</span>
        <span class="cfg-group-badge" id="grpApiBadge"></span>
      </summary>
      <div class="cfg-group-body">
        <div class="config-row">
          <label>Base URL</label>
          <input id="cfgBaseUrl" value="" placeholder="https://api.openai.com/v1">
        </div>
        <div class="config-row">
          <label>API Key</label>
          <input id="cfgApiKey" type="password" value="" placeholder="sk-...">
        </div>
      </div>
    </details>
    <details class="cfg-group" id="grpModel" ontoggle="cfgGroupToggled(event)">
      <summary class="cfg-group-head">
        <span class="cfg-group-title" id="grpModelTitle">模型参数</span>
        <span class="cfg-group-badge" id="grpModelBadge"></span>
      </summary>
      <div class="cfg-group-body">
        <div class="config-row">
          <label>System Prompt</label>
          <textarea id="cfgSystem" rows="3" class="cfg-textarea"
            placeholder="System Prompt (supports multi-line)">You are a helpful, highly knowledgeable assistant.</textarea>
        </div>
        <div class="cfg-duo">
          <div class="config-row">
            <label>Temperature</label>
            <input id="cfgTemp" type="number" value="0.5" min="0" max="2" step="0.1">
          </div>
          <div class="config-row">
            <label id="maxTokLabel">Max Tokens</label>
            <input id="cfgMaxTok" type="number" value="32768" min="1" max="200000">
          </div>
        </div>
        <div class="config-hint-line">
          <span class="config-hint" id="maxTokHint">仅限单次<b>输出</b>长度，非上下文窗口。</span>
          <button type="button" class="cfg-info" id="maxTokInfoBtn" aria-expanded="false"
            aria-controls="maxTokDetail" onclick="cfgToggleInfo('maxTokDetail', this)">ⓘ</button>
        </div>
        <div class="cfg-detail" id="maxTokDetail" hidden></div>
      </div>
    </details>
    <details class="cfg-group" id="grpAgent" ontoggle="cfgGroupToggled(event)">
      <summary class="cfg-group-head">
        <span class="cfg-group-title" id="grpAgentTitle">Agent 能力</span>
        <span class="cfg-group-badge" id="grpAgentBadge"></span>
      </summary>
      <div class="cfg-group-body">
        <div class="search-toggle" style="margin-bottom:6px">
          <input type="checkbox" id="cfgSearchEnabled" checked>
          <label for="cfgSearchEnabled">启用 Agent 联网能力（搜索+抓取网页）</label>
        </div>
        <div class="search-toggle" style="margin-bottom:2px">
          <input type="checkbox" id="cfgCodeEnabled" onchange="saveConfig()">
          <label for="cfgCodeEnabled" id="codeEnabledLabel">启用 Agent 代码执行（Python / JS 本地沙箱）</label>
        </div>
        <div class="config-hint-line">
          <span class="config-hint" id="codeEnabledHint">代码在<b>你的浏览器沙箱</b>内运行，首次约 10MB。</span>
          <button type="button" class="cfg-info" id="codeInfoBtn" aria-expanded="false"
            aria-controls="codeEnabledDetail" onclick="cfgToggleInfo('codeEnabledDetail', this)">ⓘ</button>
        </div>
        <div class="cfg-detail" id="codeEnabledDetail" hidden></div>
        <div class="config-row" id="toolChoiceRow" style="margin-bottom:0">
          <label id="toolChoiceLabel">工具调用策略</label>
          <select id="cfgToolChoice" onchange="setToolChoice(this.value)">
            <option value="auto">自动（模型自行决定是否调用）</option>
            <option value="required">强制调用（至少调用一次工具）</option>
            <option value="none">禁用工具（仅用已有知识回答）</option>
          </select>
        </div>
      </div>
    </details>
    <details class="cfg-group" id="grpSearch" ontoggle="cfgGroupToggled(event)">
      <summary class="cfg-group-head">
        <span class="cfg-group-title" id="grpSearchTitle">搜索服务</span>
        <span class="cfg-group-badge" id="grpSearchBadge"></span>
      </summary>
      <div class="cfg-group-body">
        <div class="config-row">
          <label>SerpAPI Key</label>
          <input id="cfgSerpApiKey" type="password" value="" placeholder="your_serpapi_key">
        </div>
        <div class="config-row" style="margin-bottom:0">
          <label>Brave Search Key</label>
          <input id="cfgBraveKey" type="password" value="" placeholder="your_brave_key">
        </div>
      </div>
    </details>
    <div class="cfg-actions">
      <button class="btn btn-ghost btn-sm" style="flex:1" onclick="showModelListModal()">📋 模型列表</button>
      <button class="btn btn-ghost btn-sm" style="flex:1" onclick="checkBalance()">💰 余额</button>
      <button class="btn btn-ghost btn-sm" style="flex:1" onclick="checkSearchKeyUsage()">🔍 搜索用量</button>
    </div>
  </div>
</aside>

<!-- MAIN -->
<main class="main">
  <div class="topbar">
    <button class="topbar-toggle" onclick="toggleSidebar()" title="切换侧边栏">☰</button>
    <div class="topbar-model">
      <span style="font-size:.75rem;color:var(--text3)">模型:</span>
      <select id="modelSelect">
        <option value="">加载中...</option>
      </select>
    </div>
    <div class="topbar-info" id="topbarInfo"></div>
    <div class="topbar-actions">
      <button class="icon-btn" id="ctxToggleBtn" onclick="toggleCtxPanel()" title="缓存区">📚</button>
      <button class="icon-btn" id="debugToggleBtn" onclick="toggleDebugPanel()" title="调试日志" style="position:relative">🐛<span class="debug-badge" id="debugBadge"></span></button>
      <button class="icon-btn" id="arenaBtn" onclick="showArenaModal()" title="模型竞技场（多模型并排对比）">⚔️</button>
      <button class="icon-btn" id="promptLibBtn" onclick="showPromptLibraryModal()" title="Prompt 模板库">📝</button>
      <button class="icon-btn" id="profileBtn" onclick="showProfileModal()" title="个人信息（用户自己填写）">👤</button>
      <button class="icon-btn" id="memoryBtn" onclick="showMemoryModal()" title="长期记忆（Agent 自行维护，可编辑）">🧠</button>
      <button class="icon-btn" id="exportBtn" onclick="showExportModal()" title="导出对话">📥</button>
      <button class="icon-btn" onclick="showSettingsModal()" title="设置">⚙</button>
    </div>
  </div>
  <div class="chat-area" id="chatArea">
    <div class="chat-messages" id="chatMessages">
      <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-logo">✦</div>
        <div class="welcome-title">ETA</div>
        <div class="welcome-sub">Edge Thin Agent — 支持连续对话、图片上传、对话分支回退、模型随时切换、🔍 Agent 网页搜索<br>Ctrl+Enter 发送 · 拖拽/粘贴上传文件 · 点击消息可编辑重发</div>
      </div>
    </div>
  </div>
  <div class="input-area">
    <div class="input-container">
      <div class="attachment-preview" id="attachPreview"></div>
      <div class="input-box" id="inputBox">
        <textarea id="userInput" rows="1" placeholder="输入消息... (Ctrl+Enter 发送, 可拖拽/粘贴图片)"
          oninput="autoResize(this)" onkeydown="handleInputKey(event)"></textarea>
        <div class="input-actions">
          <input type="file" id="fileInput" multiple accept="image/*,.pdf,.txt,.md,.py,.js,.ts,.json,.csv,.xml,.html,.css,.java,.c,.cpp,.h,.go,.rs,.rb,.php,.sh,.yaml,.yml,.toml,.sql,.r,.m,.docx,.pptx,.xlsx,.doc,.ppt,.xls,.tex,.log,.ini,.cfg,.conf,.env,.gitignore,.dockerfile" style="display:none" onchange="handleFileSelect(event)">
          <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="上传文件">📎</button>
          <button class="icon-btn" onclick="toggleSearchMode()" id="searchToggle" title="搜索模式: 开" style="color:var(--accent2)">🔍</button>
          <!-- 语音输入：浏览器不支持 SpeechRecognition 时由 js/voice.js 移除此按钮 -->
          <button class="icon-btn" id="micBtn" onclick="voiceToggleInput()" title="语音输入">🎤</button>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="发送">▶</button>
        </div>
      </div>
      <div class="input-hint"><span id="ctxHint"></span>Ctrl+Enter 发送 · 支持拖拽/粘贴图片和文件 · 点击历史消息可编辑重发</div>
    </div>
  </div>
</main>

<!-- DEBUG LOG PANEL -->
<div class="debug-panel" id="debugPanel">
  <div class="debug-panel-header">
    <span>🐛 调试日志</span>
    <div class="debug-panel-actions">
      <button onclick="clearDebugLog()">清空</button>
      <button onclick="copyDebugLog()">复制</button>
      <button onclick="toggleDebugPanel()">✕</button>
    </div>
  </div>
  <div class="debug-log" id="debugLog"></div>
</div>

<!-- RIGHT PANEL: Context Buffer -->
<aside class="ctx-panel" id="ctxPanel">
  <div class="ctx-panel-header">
    <span class="ctx-panel-title">📚 对话缓存区</span>
    <button class="icon-btn" onclick="toggleCtxPanel()" title="关闭缓存区">✕</button>
  </div>
  <div class="ctx-url-input">
    <input id="ctxUrlInput" placeholder="粘贴 URL 抓取..." onkeydown="if(event.key==='Enter')ctxFetchUrl()">
    <button class="btn btn-primary btn-sm" onclick="ctxFetchUrl()">抓取</button>
  </div>
  <div class="ctx-search-box">
    <input id="ctxSearchInput" placeholder="检索缓存内容 (BM25)..."
      onkeydown="ctxSearchKey(event)" oninput="ctxSearchInputChanged()">
    <button class="btn btn-ghost btn-sm" onclick="ctxPanelSearch()">🔍</button>
  </div>
  <div class="ctx-search-results" id="ctxSearchResults" style="display:none"></div>
  <div class="ctx-actions">
    <button class="btn btn-ghost btn-sm" onclick="ctxUploadFile()">📎 上传</button>
    <button class="btn btn-ghost btn-sm" onclick="ctxClearAll()">🗑 清空</button>
    <input type="file" id="ctxFileInput" multiple accept=".pdf,.txt,.md,.py,.js,.ts,.json,.csv,.xml,.html,.css,.java,.c,.cpp,.h,.go,.rs,.rb,.php,.sh,.yaml,.yml,.toml,.sql,.r,.m,.docx,.pptx,.xlsx,.tex,.log,.ini,.cfg,.conf,.env" style="display:none" onchange="ctxHandleFileUpload(event)">
  </div>
  <div class="ctx-list" id="ctxList"></div>
  <div class="ctx-stats" id="ctxStats">
    <span>0 项 · 0 tokens</span>
    <span>已选: 0 项</span>
  </div>
</aside>

<!-- JS 模块（按依赖顺序加载） -->
<script src="js/env.js" onerror="window.ENV={}"></script>
<script src="js/debug.js"></script>
<script src="js/storage.js"></script>
<script src="js/state.js"></script>
<script src="js/conversation.js"></script>
<script src="js/render.js"></script>
<script src="js/artifacts.js"></script>
<script src="js/file-parser.js"></script>
<script src="js/search.js"></script>
<script src="js/context-buffer.js"></script>
<script src="js/retrieval.js"></script>
<script src="js/custom-tools.js"></script>
<!-- 长期记忆 / 用户档案：必须先于 agent.js（工具定义）与 conversation.js 的首次调用 -->
<script src="js/memory.js"></script>
<script src="js/profile.js"></script>
<script src="js/memory-ui.js"></script>
<script src="js/agent.js"></script>
<script src="js/agent-loop.js"></script>
<script src="js/sandbox-python.js"></script>
<script src="js/sandbox-js.js"></script>
<script src="js/agent-commands.js"></script>
<script src="js/agent-generate.js"></script>
<script src="js/ui.js"></script>
<!-- 第四期：循环可视化 / 多模型 / 交互（eta-config.js 必须先于其余第四期模块） -->
<script src="js/eta-config.js"></script>
<script src="js/agent-timeline.js"></script>
<script src="js/multi-model.js"></script>
<script src="js/voice.js"></script>
<script src="js/prompt-library.js"></script>
<script src="js/export-plus.js"></script>
<script src="js/pwa.js"></script>
<script src="js/eta-settings.js"></script>
<script src="js/init.js"></script>
<script>
// 启动自检：确保所有关键模块加载成功
(function selfCheck() {
  const missing = [];
  if (typeof STATE === 'undefined') missing.push('state.js');
  if (typeof storageLoadChatState === 'undefined') missing.push('storage.js');
  if (typeof sendMessage === 'undefined') missing.push('agent.js');
  if (typeof showModelListModal === 'undefined') missing.push('ui.js');
  if (typeof doWebSearch === 'undefined') missing.push('search.js');
  if (typeof handleStreamResponseAgent === 'undefined') missing.push('agent-loop.js');
  if (typeof renderChat === 'undefined') missing.push('render.js');
  if (typeof mountArtifacts === 'undefined') missing.push('artifacts.js');
  if (typeof runPythonCode === 'undefined') missing.push('sandbox-python.js');
  if (typeof runJsCode === 'undefined') missing.push('sandbox-js.js');
  if (typeof etaCfg === 'undefined') missing.push('eta-config.js');
  if (typeof timelineStart === 'undefined') missing.push('agent-timeline.js');
  if (typeof arenaRun === 'undefined') missing.push('multi-model.js');
  if (typeof voiceToggleInput === 'undefined') missing.push('voice.js');
  if (typeof showPromptLibraryModal === 'undefined') missing.push('prompt-library.js');
  if (typeof showExportModal === 'undefined') missing.push('export-plus.js');
  if (typeof pwaRegister === 'undefined') missing.push('pwa.js');
  if (typeof etaSettingsSectionHtml === 'undefined') missing.push('eta-settings.js');
  if (typeof retrSearch === 'undefined') missing.push('retrieval.js');
  if (typeof ctGetToolDefinitions === 'undefined') missing.push('custom-tools.js');
  if (typeof memPromptBlock === 'undefined') missing.push('memory.js');
  if (typeof profPromptBlock === 'undefined') missing.push('profile.js');
  if (typeof showMemoryModal === 'undefined') missing.push('memory-ui.js');
  if (missing.length > 0) {
    document.body.innerHTML = '<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1a1a2e;color:#fff;font-family:system-ui;padding:40px;text-align:center"><div>'
      + '<h1 style="color:#ff6b6b;margin-bottom:16px">⚠️ 加载失败</h1>'
      + '<p style="font-size:1.1rem;margin-bottom:12px">以下模块未能加载：<br><b>' + missing.join(', ') + '</b></p>'
      + '<p style="color:#aaa;font-size:.9rem;max-width:500px;margin:0 auto">可能原因：<br>'
      + '① OneDrive 文件未同步完成（右键文件夹 → 始终保留在此设备上）<br>'
      + '② 文件夹结构不完整，缺少 js/ 目录<br>'
      + '③ 浏览器安全策略阻止了 file:// 加载本地脚本</p>'
      + '<p style="margin-top:20px;color:#aaa;font-size:.85rem">请确保 js/ 文件夹与此 HTML 在同一目录下，且所有文件已完整下载。</p>'
      + '</div></div>';
    return;
  }
  // 检查是否缺少 API 配置
  var env = window.ENV || {};
  var hasEnv = !!(env.BASE_URL && env.API_KEY);
  var hasLocal = false;
  try {
    var raw = localStorage.getItem('ai-chat-cfg');
    if (raw) { var c = JSON.parse(raw); hasLocal = !!(c.baseUrl && c.apiKey); }
  } catch(e) {}
  if (!hasEnv && !hasLocal) {
    // 显示配置引导浮层
    var overlay = document.createElement('div');
    overlay.id = 'setupOverlay';
    overlay.innerHTML = '<div style="position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:99999;font-family:system-ui;padding:20px">'
      + '<div style="background:#1e1e2e;border-radius:16px;padding:36px 32px;max-width:420px;width:100%;color:#eee;box-shadow:0 8px 32px rgba(0,0,0,.5)">'
      + '<h2 style="margin:0 0 8px;font-size:1.4rem">👋 首次使用配置</h2>'
      + '<p style="color:#aaa;font-size:.85rem;margin-bottom:20px">检测到尚未配置 API，请填写以下信息后即可使用。<br>配置会保存在浏览器本地，不会上传。</p>'
      + '<label style="font-size:.8rem;color:#888">Base URL</label>'
      + '<input id="_setupBase" style="width:100%;padding:8px 12px;margin:4px 0 12px;border-radius:8px;border:1px solid #444;background:#2a2a3e;color:#fff;font-size:.9rem" placeholder="https://api.openai.com/v1">'
      + '<label style="font-size:.8rem;color:#888">API Key</label>'
      + '<input id="_setupKey" type="password" style="width:100%;padding:8px 12px;margin:4px 0 20px;border-radius:8px;border:1px solid #444;background:#2a2a3e;color:#fff;font-size:.9rem" placeholder="sk-...">'
      + '<button id="_setupBtn" style="width:100%;padding:10px;border:none;border-radius:8px;background:#6c63ff;color:#fff;font-size:1rem;cursor:pointer;font-weight:600">开始使用 ✦</button>'
      + '<p style="color:#666;font-size:.75rem;margin-top:12px;text-align:center">搜索功能（SerpAPI / Brave）可稍后在左侧面板配置</p>'
      + '</div></div>';
    document.body.appendChild(overlay);
    document.getElementById('_setupBtn').onclick = function() {
      var base = document.getElementById('_setupBase').value.trim();
      var key = document.getElementById('_setupKey').value.trim();
      if (!base || !key) { alert('请填写 Base URL 和 API Key'); return; }
      document.getElementById('cfgBaseUrl').value = base;
      document.getElementById('cfgApiKey').value = key;
      saveConfig();
      overlay.remove();
      // 首次配置完成，「API 连接」的强制展开可以撤了，按用户偏好重新落位
      if (typeof cfgApplyGroups === 'function') {
        try { cfgApplyGroups(JSON.parse(localStorage.getItem('ai-chat-cfg') || '{}').groups); }
        catch (e) {}
      }
    };
  }
})();
</script>

</body>
</html>
